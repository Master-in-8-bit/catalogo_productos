<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="Section">
        <h1>Agregar producto</h1>
        <div class="inputs">
            <div class="input">
                <h2>Nombre</h2>
                <input type="text" id="addname">
            </div>
            <div class="input">
                <h2>Categoria</h2>
                <label for="addcat"></label>
                <select name="" id="addcat">
                    
                </select>
            </div>
            <div class="input">
                <h2>Precio ($)</h2>
                <input type="number" id="addprice">
            </div>
            <div class="input">
                <h2>Stock</h2>
                <input type="number" id="addstock">
            </div>
        </div>
        <br>
        <button id="add">Agregar producto</button>
    </div>
    <div class="Section">
        <h1>Buscar y filtrar por nombre</h1>
        <div class="inputs">
            <div class="input" id="filtrarnombre">
                <h2>Buscar por nombre</h2>
                <input type="text" id="filtername">
            </div>
            <div class="input">
                <h2>Categoria</h2>
                <input type="text" id="filtercat" readonly>
            </div>
            <div class="input">
                <h2>Disponibilidad</h2>
                <input type="text" id="filterdisp" readonly>
            </div>
            <div class="input">
                <h2>Precio</h2>
                <input readonly="number" id="filterprice">
            </div>
        </div>
        <br>
        <button id="filter">Filtrar producto</button>
    </div>
    <div class="Section">
        <h1>Resumen del inventario</h1>
        <div id="divsub1">
            <div id="divsub2">
                <table id="tablafiltro">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Stock</th>
                        </tr>
                    </thead>
                    <tbody id="tablafiltro1"></tbody>
                </table>
            </div>
            <div id="divsub2">
                <table id="tablafiltro">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Stock</th>
                        </tr>
                    </thead>
                    <tbody id="tablafiltro2"></tbody>
                </table>
            </div>
        </div>
    </div>
    <div class="Section">
        <h1>Productos</h1>
        <table>
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Categoria</th>
                    <th>Precio</th>
                    <th>Stock</th>
                </tr>
            </thead>
            <tbody id="tablaProductos"></tbody>
        </table>
    </div>
    <script src="./dist/index.js" defer></script>
</body>
</html>
